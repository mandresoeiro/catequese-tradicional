site_name: Catequese Tradicional
site_description: Estudos organizados do Catecismo de São Pio X — Centro Dom Bosco
site_author: Marcio Soeiro
site_url: https://mandresoeiro.github.io/catequese-tradicional/

repo_name: mandresoeiro/catequese-tradicional
repo_url: https://github.com/mandresoeiro/catequese-tradicional
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Usar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Usar modo claro
  icon:
    logo: material/book-cross

nav:
  - Início: index.md
  - Aulas:
      - Visão geral: aulas/index.md
      - Aula 01 — Origem do Catecismo e fontes da Revelação: aulas/aula-01.md
      - Aula 02 — Magistério da Igreja, Sagrada Escritura e o Credo: aulas/aula-02.md
  - Dicionário Geral: dicionario.md
  - Questionários:
      - Aula 01: questionarios/aula-01.md
      - Aula 02: questionarios/aula-02.md
  - Sobre o projeto: sobre.md
  - Notion: https://app.notion.com/p/3da3fd17d4d4804b8f1fd881fe445019

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mandresoeiro
    - icon: fontawesome/brands/notion
      link: https://app.notion.com/p/3da3fd17d4d4804b8f1fd881fe445019
