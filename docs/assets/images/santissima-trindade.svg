<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860">
<rect width="1000" height="860" fill="#f7f0df"/>
<rect x="24" y="24" width="952" height="812" rx="28" fill="none" stroke="#b9924b" stroke-width="3"/>
<text x="500" y="90" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#15385a">Santíssima Trindade</text>
<text x="500" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#8b6a32">esquema didático</text>
<line x1="500" y1="260" x2="260" y2="500" stroke="#315b7a" stroke-width="6"/>
<line x1="500" y1="260" x2="740" y2="500" stroke="#315b7a" stroke-width="6"/>
<line x1="260" y1="500" x2="740" y2="500" stroke="#315b7a" stroke-width="6"/>
<circle cx="500" cy="230" r="95" fill="#fffaf0" stroke="#b9924b" stroke-width="5"/>
<circle cx="260" cy="500" r="95" fill="#fffaf0" stroke="#b9924b" stroke-width="5"/>
<circle cx="740" cy="500" r="95" fill="#fffaf0" stroke="#b9924b" stroke-width="5"/>
<text x="500" y="242" text-anchor="middle" font-family="Georgia,serif" font-size="46" font-weight="700" fill="#17395a">Pai</text>
<text x="260" y="512" text-anchor="middle" font-family="Georgia,serif" font-size="46" font-weight="700" fill="#17395a">Filho</text>
<text x="740" y="486" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#17395a">Espírito</text>
<text x="740" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#17395a">Santo</text>
<rect x="345" y="365" width="310" height="110" rx="18" fill="#fffaf0" stroke="#d0b16d" stroke-width="2"/>
<text x="500" y="415" text-anchor="middle" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#15385a">Um só Deus</text>
<text x="500" y="453" text-anchor="middle" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#15385a">em três Pessoas</text>
<text x="500" y="625" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#2c2b28">O esquema ajuda a compreender;</text>
<text x="500" y="658" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#2c2b28">não esgota o mistério.</text>
<rect x="120" y="700" width="760" height="105" rx="18" fill="#eef4f8" stroke="#9ab2c2" stroke-width="2"/>
<text x="150" y="740" font-family="Georgia,serif" font-size="23" fill="#17395a">1. Há um só Deus.</text>
<text x="150" y="772" font-family="Georgia,serif" font-size="23" fill="#17395a">2. Pai, Filho e Espírito Santo são distintos.</text>
<text x="150" y="804" font-family="Georgia,serif" font-size="23" fill="#17395a">3. As três Pessoas são divinas.</text>
</svg>