<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#F6F0E4"/>
<rect x="40" y="40" width="1120" height="1520" rx="30" fill="none" stroke="#B88A44" stroke-width="4"/>
<text x="600" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#143454">NATURAL E SOBRENATURAL</text>
<text x="600" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#8A6734">Resumo visual de catequese</text>
<rect x="70" y="210" width="500" height="900" rx="24" fill="#F1E4C7" stroke="#A77835" stroke-width="3"/>
<rect x="630" y="210" width="500" height="900" rx="24" fill="#E5EEF7" stroke="#204F78" stroke-width="3"/>
<rect x="70" y="210" width="500" height="100" rx="24" fill="#9A7136"/>
<rect x="630" y="210" width="500" height="100" rx="24" fill="#163F65"/>
<text x="320" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#fff">NATURAL</text>
<text x="880" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#fff">SOBRENATURAL</text>
<g font-family="Georgia, serif" font-size="28" fill="#2C2A27">
<text x="110" y="370">• Nasce da percepção humana.</text>
<text x="110" y="445">• A razão percebe sinais de Deus</text><text x="145" y="480">na criação e na consciência moral.</text>
<text x="110" y="555">• Parte do homem em direção a Deus.</text>
<text x="110" y="630">• Ajuda a reconhecer o bem e o mal.</text>
<text x="110" y="705">• Exemplos: honrar pai e mãe,</text><text x="145" y="740">rejeitar o homicídio injusto,</text><text x="145" y="775">buscar o bem.</text>
<text x="110" y="865">• Limite: não alcança sozinha</text><text x="145" y="900">toda a verdade revelada.</text>
</g>
<g font-family="Georgia, serif" font-size="28" fill="#16324A">
<text x="670" y="370">• Vem de Deus.</text>
<text x="670" y="445">• É a Revelação divina.</text>
<text x="670" y="520">• Mostra quem Deus é e como</text><text x="705" y="555">quer ser adorado.</text>
<text x="670" y="630">• Alcança sua plenitude</text><text x="705" y="665">em Jesus Cristo.</text>
<text x="670" y="740">• Chega até nós pela Sagrada</text><text x="705" y="775">Escritura e pela Tradição.</text>
<text x="670" y="850">• Eleva o homem para além</text><text x="705" y="885">do que a razão sozinha alcança.</text>
</g>
<rect x="260" y="1010" width="680" height="120" rx="20" fill="#FFF9EE" stroke="#B88A44" stroke-width="3"/>
<text x="600" y="1060" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#4C3A24">O natural prepara.</text>
<text x="600" y="1100" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#173D60">O sobrenatural eleva e completa.</text>
<rect x="70" y="1180" width="1060" height="270" rx="24" fill="#FFFFFF" stroke="#B88A44" stroke-width="3"/>
<text x="600" y="1235" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#173D60">PARA GUARDAR</text>
<g font-family="Georgia, serif" font-size="24" fill="#2C2A27">
<text x="110" y="1295">1. Natural não é o mesmo que sobrenatural.</text>
<text x="110" y="1340">2. O natural ajuda a perceber Deus; o sobrenatural é Deus que se revela.</text>
<text x="110" y="1385">3. A Revelação é plena em Cristo.</text>
<text x="110" y="1430">4. A fé católica é transmitida pela Escritura e pela Tradição.</text>
</g>
<text x="600" y="1510" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#173D60">“A religião natural parte do homem; a Revelação sobrenatural vem de Deus.”</text>
</svg>