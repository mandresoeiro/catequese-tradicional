<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Aula 11 — Santa Igreja Católica</title>
<desc id="desc">Fundada por Jesus Cristo para a salvação das almas. Ensino e sacramentos. Quatro notas: una, santa, católica e apostólica. Papa e bispos. Infalibilidade não é impecabilidade.</desc>
<rect width="760" height="430" rx="20" fill="#142c34"/>
<g font-family="Arial, sans-serif" fill="#f8f3e8">
<text x="36" y="42" font-size="14" fill="#d7b77b">CATEQUESE TRADICIONAL · AULA 011</text>
<text x="36" y="82" font-size="30" font-weight="bold">Santa Igreja Católica</text>
<text x="36" y="116" font-size="18">Jesus Cristo · Salvação das almas · Fé e sacramentos</text>
<g fill="#23444d"><rect x="30" y="147" width="340" height="87" rx="12"/><rect x="390" y="147" width="340" height="87" rx="12"/><rect x="30" y="249" width="340" height="87" rx="12"/><rect x="390" y="249" width="340" height="87" rx="12"/></g>
<g font-size="23" font-weight="bold" fill="#e2c58f"><text x="50" y="180">UNA</text><text x="410" y="180">SANTA</text><text x="50" y="282">CATÓLICA</text><text x="410" y="282">APOSTÓLICA</text></g>
<g font-size="16"><text x="50" y="211">Unidade na fé e na comunhão</text><text x="410" y="211">Meios de santificação</text><text x="50" y="313">Missão universal</text><text x="410" y="313">Fé e sucessão dos apóstolos</text></g>
<text x="36" y="373" font-size="17">Papa: sucessor de Pedro · Bispos: sucessores dos apóstolos</text>
<text x="36" y="405" font-size="16" fill="#e2c58f">Infalibilidade ≠ impecabilidade · Consulte as notas da aula.</text>
</g></svg>
